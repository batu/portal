<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Evidence Stream — Stream</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Gallery</a>
  </header>
  <main>

<section class="stream-detail">
  <div class="stream-header">
    <h1>Evidence Stream</h1>
    <div class="request-meta">
      <span class="tag">/s/evidence-stream</span>
      <span class="tag kind">session</span>
      <span class="age">created 1m ago</span>

    </div>
  </div>





  <ul class="post-list">

    <li class="post-card post-report">
      <div class="post-header">
        <div>
          <div class="post-title">Evidence Report</div>
          <div class="request-meta">
            <span class="tag kind">report</span>
            <span class="tag">codex-evidence</span>
            <span class="age">just now</span>
          </div>
        </div>
      </div>



        <div class="report-actions">
          <a class="media-link" href="/media/p_evidence_report/report.html" target="_blank" rel="noopener noreferrer">report.html</a>
        </div>

        <iframe class="report-frame" src="/media/p_evidence_report/report.html" sandbox="allow-same-origin" loading="lazy" referrerpolicy="no-referrer" title="Evidence Report"></iframe>


    </li>

  </ul>
</section>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
