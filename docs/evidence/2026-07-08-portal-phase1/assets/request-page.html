<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Portal phase 1 before after — Gallery</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Gallery</a>
  </header>
  <main>



<section class="request-detail" data-req-id="req_evidence_1" data-kind="before-after" data-status="open" data-before-default-view="toggle" data-can-decide="true">
  <h1>Portal phase 1 before after</h1>
  <div class="request-meta">
    <span class="tag">portal/phase1-e2e</span>
    <span class="tag kind">before-after</span>
    <span class="age">just now</span>
  </div>


  <div class="context"><p>Choose the after state that best matches the report.</p></div>







  <div class="before-after-review" data-before-review data-mode="toggle">
    <div class="view-switcher" role="group" aria-label="Before after view">
      <button type="button" class="view-switcher-option" data-before-view="side-by-side" aria-pressed="false">Side-by-side</button>
      <button type="button" class="view-switcher-option" data-before-view="toggle" aria-pressed="true">Toggle</button>
    </div>

    <div class="before-card before-side-by-side" data-before-block data-side-by-side hidden>
      <div class="before-label">BEFORE</div>
      <div class="before-media">

        <a href="/media/req_evidence_1/__before.png?token=" target="_blank" rel="noopener">
          <img loading="lazy" src="/media/req_evidence_1/__before.png?token=" alt="before image">
        </a>

      </div>
    </div>

    <div class="toggle-view" data-before-toggle>
      <div class="toggle-frame" data-toggle-frame>
        <div class="toggle-layer toggle-before-layer" data-toggle-layer="before">
          <div class="before-label">BEFORE</div>
          <div class="before-media">

            <img loading="lazy" src="/media/req_evidence_1/__before.png?token=" alt="before image">

          </div>
        </div>
        <div class="toggle-layer toggle-candidate-layer" data-toggle-layer="candidate">

          <div class="toggle-candidate-media" data-toggle-candidate="1" hidden>

            <img loading="lazy" src="/media/req_evidence_1/01_after-1.png?token=" alt="variant 1">

          </div>

          <div class="toggle-candidate-media" data-toggle-candidate="2" hidden>

            <img loading="lazy" src="/media/req_evidence_1/02_after-2.html?token=" alt="variant 2">

          </div>

        </div>
      </div>
    </div>
  </div>


  <div class="variant-grid" data-candidate-grid>

    <div class="variant" data-idx="1" tabindex="0" role="button" aria-pressed="false">
      <div class="variant-media">

        <a href="/media/req_evidence_1/01_after-1.png?token=" target="_blank" rel="noopener">
          <img loading="lazy" src="/media/req_evidence_1/01_after-1.png?token=" alt="variant 1">
        </a>

      </div>
      <div class="variant-footer">
        <span class="variant-number">1</span>
        <span class="order-badge" hidden></span>

      </div>
    </div>

    <div class="variant" data-idx="2" tabindex="0" role="button" aria-pressed="false">
      <div class="variant-media">

        <a href="/media/req_evidence_1/02_after-2.html?token=" target="_blank" rel="noopener">
          <img loading="lazy" src="/media/req_evidence_1/02_after-2.html?token=" alt="variant 2">
        </a>

      </div>
      <div class="variant-footer">
        <span class="variant-number">2</span>
        <span class="order-badge" hidden></span>

      </div>
    </div>

  </div>


  <div class="decision-panel">


    <textarea class="comment-box" placeholder="Comment (optional)…"></textarea>


    <button type="button" class="btn decide" id="decide-btn">Decide</button>

    <div class="hint">
      Tap one variant, then Decide.

    </div>
  </div>

</section>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
