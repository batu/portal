{% extends "base.html" %}
{% block title %}Sign in — Portal{% endblock %}
{% block content %}
<section class="login" style="max-width: 22rem; margin: 12vh auto 0; text-align: center;">
  <h1>Portal</h1>
  <p style="opacity: 0.7;">Enter the passphrase to continue.</p>
  {% if error %}
  <p style="color: #c0392b;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next_path }}">
    <input type="password" name="password" placeholder="Passphrase" autofocus
           style="width: 100%; padding: 0.6rem; margin: 0.5rem 0; font-size: 1rem;">
    <button type="submit" class="btn" style="width: 100%; padding: 0.6rem; font-size: 1rem;">Sign in</button>
  </form>
</section>
{% endblock %}
