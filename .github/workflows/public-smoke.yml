name: Public Portal smoke test

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check Portal health and Marble Run page
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 https://portal.basegamelab.com/api/health >/dev/null
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 https://portal.basegamelab.com/games/marble-run >/dev/null
      - name: Check public build supports ranged downloads
        run: |
          status=$(curl --output /dev/null --silent --show-error --retry 3 --retry-all-errors --max-time 30 --range 0-1023 --write-out '%{http_code}' https://portal.basegamelab.com/games/marble-run/builds/2026.07.18-1/public-download)
          test "$status" = "206"
